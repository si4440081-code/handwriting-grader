name: 시연 서버 배포 (Hugging Face)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub
      - name: Space에 올리기
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEMO_ACCESS_CODE: ${{ secrets.DEMO_ACCESS_CODE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEMO_DAILY_LIMIT: ${{ vars.DEMO_DAILY_LIMIT }}
          DEFAULT_SUBJECT: ${{ vars.DEFAULT_SUBJECT }}
          READ_WORKERS: ${{ vars.READ_WORKERS }}
        run: python .github/deploy_space.py
